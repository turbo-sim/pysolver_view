[tool.poetry]
name = "pysolver_view"
version = "0.7.1"
description = "Visualization of solver convergence evolution"
authors = ["Roberto Agromayor"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/turbo-sim/pysolver_view"
documentation = "https://turbo-sim.github.io/pysolver_view/"
packages = [{ include = "pysolver_view", from = "src" }]
include = [{ path = "src/pysolver_view/optimization/solvers/slsqp/SCIPY_LICENSE.txt", format = ["sdist", "wheel"] }]


[tool.poetry.dependencies]
python = ">=3.10,<3.14"
numpy = "^2.2.4"
scipy = [
    { version = "^1.15.2", python = ">=3.10,<3.11" },
    { version = "1.17.1", python = ">=3.11,<3.14" },
]
matplotlib = "^3.10.1"
pandas = "^2.2.3"
openpyxl = "^3.1.5"
PyYAML = "^6.0.2"
toml = "^0.10.2"
cycler = "^0.12.1"
jax = { version = "^0.5.3", optional = true }
CoolProp = { version = ">=6.6,<8", optional = true }

[tool.poetry.extras]
jax = ["jax"]
thermodynamics = ["CoolProp"]

[tool.poetry.group.dev.dependencies]
ipython = ">=8.13,<8.17"
black = "^26.3.1"
pytest = "^8.3.5"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
bump-my-version = "^1.5.1"
sphinx-autobuild = "^2024.10.3"
myst-parser = "^4.0.1"
linkify-it-py = ">=2,<3"
bibtexparser = "^1.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Installation of optional dependencies
# pip install pysolver_view
# pip install pysolver_view[jax]
# poetry install --extras jax

# Version bumping and releasing (run from the repository root):
# 1. Install development tools: poetry install --with dev
# 2. Commit your changes first; bumping requires a clean working tree.
# 3. Preview a bump: poetry run bump-my-version bump --dry-run --verbose patch
# 4. Choose ONE increment (updates version files, commits, and creates a vX.Y.Z tag):
#    poetry run bump-my-version bump patch
#    poetry run bump-my-version bump minor
#    poetry run bump-my-version bump major
# 5. Release from main: git push origin main --follow-tags
#    GitHub Actions builds, tests, and publishes the pushed release tag.

